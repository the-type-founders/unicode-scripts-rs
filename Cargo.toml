[package]
name = "unicode-scripts"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Ivan Ukhov <ivan.ukhov@gmail.com>"]
description = "The package provides detection of scripts from Unicode codepoints."
documentation = "https://docs.rs/unicode-scripts"
repository = "https://github.com/the-type-founders/unicode-scripts"
categories = ["text-processing"]
keywords = ["writing-system", "unicode"]

[dependencies]
interavl = "0.6"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
